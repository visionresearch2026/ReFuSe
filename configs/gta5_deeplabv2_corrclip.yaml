# ReFuSe: GTA5 -> Cityscapes, DeepLabV2-ResNet101, CorrCLIP
source: gta5
backbone: deeplabv2
source_ckpt: checkpoints/GTA5_source.pth
data:
  cityscapes_root: data/Cityscapes
  ps_root: data/pseudo_labels/gta5_deeplabv2/train   # generate_pseudolabels.py
  sam2_root: data/sam2_masks/train   # <city>/<stem>_leftImg8bit.npz
vlm:
  name: corrclip
  # pre-extracted CorrCLIP outputs per training image (see README, Data preparation)
  seg_root: data/corrclip/segmentation/train   # <city>/<stem>_leftImg8bit.png
  feat_root: data/corrclip/features/train      # <city>/<stem>_leftImg8bit.pt (512,h,w)
  text_embed: data/corrclip/cityscapes_clip_text_embeddings.pt   # {'embeddings': (19,512)}
work_dir: work_dirs/gta5_deeplabv2_corrclip
